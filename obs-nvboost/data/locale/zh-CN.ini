# ------------------------------------------------------- rate control
QPMin="最小 QP（0 = 自动）"
QPMax="最大 QP（0 = 自动）"
QPInit="初始 QP（0 = 自动）"
VBVBufSize="VBV 缓冲大小（0 = 自动）"
VBVBufSize.ToolTip="VBV（视频缓冲验证）缓冲大小，单位 kbps。\n较低的值产生更稳定的帧大小（适合推流），\n较高的值允许质量突发（适合录制）。\n0 = 自动：不显式限制，由驱动根据码率与 level 决定。"
TemporalAQ="时域 AQ"
TemporalAQ.ToolTip="启用时域自适应量化，将码率跨帧转移到最需要的位置，\n代价是略微增加 GPU 占用。"
AdaptiveQuantization="自适应量化（空域 AQ）(2D不推荐)"
AdaptiveQuantization.ToolTip="不推荐 2D 内容使用。数值越大，亮度清晰度会越多地分配给暗部，\n同时更偏向用模糊来代替伪影；数值达到最大值 15 时，整个画面就像被添加了高斯模糊。\n很多时候只推荐设置到 5 即可。"
AQStrength="空域 AQ 强度"
ChromaQPOffset="色度 QP 偏移"
ChromaQPOffset.ToolTip="色度分量相对亮度的 QP 偏移。\n正值减少色彩上的码率分配，负值增加。"

# ------------------------------------------------------ inter-frame
StrictGOP="严格 GOP"
StrictGOP.ToolTip="让每个 GOP 的实际码率贴合其自身目标，最小化 GOP 之间的码率波动。\n注意：GOP 结构含 B 帧时此选项无效。"
MultirefL0="L0 参考帧数（0 = 自动）"
MultirefL0.ToolTip="参考帧列表 L0 的最大参考帧数（1-7）。\n需要 NVENC SDK 9.1+ 与多重参考帧支持。"
MultirefL1="L1 参考帧数（0 = 自动）"
MultirefL1.ToolTip="参考帧列表 L1 的最大参考帧数（1-4）。\n需要 NVENC SDK 9.1+ 与多重参考帧支持。"
RefsFwd="前向参考帧数（0 = 预设）"
RefsFwd.ToolTip="AV1 前向参考帧的最大数量（1-4：Last、Last2、Last3、Golden）。\n此值仅供参考，驱动不保证完全遵循。"
RefsBwd="后向参考帧数（0 = 预设）"
RefsBwd.ToolTip="AV1 后向参考帧的最大数量（1-3：Backward、Altref2、Altref）。\n此值仅供参考，驱动不保证完全遵循。"
RepeatHeaders="重复 SPS/PPS 头"
RepeatHeaders.ToolTip="在每个关键帧上重复 SPS/PPS（及 AUD）。\n对流中转、中途加入串流有用；会略微增加码率。"

# ------------------------------------------------------ enc tools
LookAheadDepth="前向分析帧数（0 = 预设）"
LookAheadDepth.ToolTip="启用前向分析（Look-ahead）时向前分析的帧数（0-32）。\n更高的值可能提升画质，代价是延迟与 GPU 占用。"
LookAheadLevel="前向分析等级"
LookAheadLevel.0="等级 0"
LookAheadLevel.1="等级 1"
LookAheadLevel.2="等级 2"
LookAheadLevel.3="等级 3"
LookAheadLevel.ToolTip="更高的前向分析等级可能以性能为代价提升画质\n（仅 HEVC，SDK 12.2+，需要 570.20 以上驱动）。"
UniDirectB="单向 B 帧"
UniDirectB.ToolTip="B 帧只参考过去的帧，在低延迟场景下提升压缩效率（SDK 12.2+）。\n与加权预测互斥。"
TFLevel="时域滤波等级"
TFLevel.0="关闭"
TFLevel.4="等级 4"
TFLevel.ToolTip="启用跨帧时域滤波以提升画质（SDK 12.2+）。\n需要至少 4 个 B 帧。"
DisableAdaptiveI="禁用自适应 I 帧"
DisableAdaptiveI.ToolTip="启用前向分析时禁用自适应 I 帧插入。"
DisableAdaptiveB="禁用自适应 B 帧"
DisableAdaptiveB.ToolTip="启用前向分析时禁用自适应 B 帧插入。"
NonRefP="非参考 P 帧"
NonRefP.ToolTip="允许编码器自动插入非参考 P 帧：此类帧不会被任何后续帧用作预测参考，\n因此在负载过重时被丢弃或降低质量也不会污染后续帧。\n会略微降低压缩效率。需要 PTD（本插件始终启用）。"
WeightP="加权 P 帧"
WeightP.ToolTip="启用 P 帧加权预测，提升淡入淡出和低运动场景的画质。\n需要 0 个 B 帧，且与强制分割编码互斥。"
MvPrecision="运动估计精度"
