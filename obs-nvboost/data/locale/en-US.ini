# ------------------------------------------------------- rate control
QPMin="Minimum QP (0 = auto)"
QPMax="Maximum QP (0 = auto)"
QPInit="Initial QP (0 = auto)"
VBVBufSize="VBV Buffer Size (0 = auto)"
VBVBufSize.ToolTip="Size of the VBV (Video Buffering Verifier) buffer in kbps.\nLower values produce more consistent frame sizes (better for streaming),\nhigher values allow bursts of quality (better for recording).\n0 = automatic: no explicit limit, the driver decides based on bitrate and level."
TemporalAQ="Temporal AQ"
TemporalAQ.ToolTip="Enables temporal adaptive quantization, moving bitrate across frames\nto where it is most needed, at the cost of slightly increased GPU utilization."
AdaptiveQuantization="Spatial AQ (not recommended for 2D)"
AdaptiveQuantization.ToolTip="Not recommended for 2D content. Higher values allocate more brightness clarity to dark areas,\nand prefer blur over blocking artifacts; at the maximum value of 15, the whole picture looks like a Gaussian blur was applied.\nIn most cases a value of 5 is recommended."
AQStrength="Spatial AQ Strength"
ChromaQPOffset="Chroma QP Offset"
ChromaQPOffset.ToolTip="QP offset applied to chroma components relative to luma.\nPositive values spend less bitrate on color, negative values more."

# ------------------------------------------------------ inter-frame
StrictGOP="Strict GOP"
StrictGOP.ToolTip="Minimizes bitrate fluctuations between GOPs by making each GOP hit its own rate target.\nNote: ignored when B-frames are enabled."
MultirefL0="Reference Frames L0 (0 = auto)"
MultirefL0.ToolTip="Maximum number of reference frames in list L0 (1-7).\nRequires NVENC SDK 9.1+ and multi-reference support."
MultirefL1="Reference Frames L1 (0 = auto)"
MultirefL1.ToolTip="Maximum number of reference frames in list L1 (1-4).\nRequires NVENC SDK 9.1+ and multi-reference support."
RefsFwd="Forward Reference Frames (0 = preset)"
RefsFwd.ToolTip="Maximum forward reference frames for AV1 (1-4: Last, Last2, Last3, Golden).\nThis is a suggestive value and may not always be honored."
RefsBwd="Backward Reference Frames (0 = preset)"
RefsBwd.ToolTip="Maximum backward reference frames for AV1 (1-3: Backward, Altref2, Altref).\nThis is a suggestive value and may not always be honored."
RepeatHeaders="Repeat SPS/PPS Headers"
RepeatHeaders.ToolTip="Repeats SPS/PPS (and AUD) on every keyframe.\nUseful for stream relaying and joining mid-stream; slightly increases bitrate."

# ------------------------------------------------------ enc tools
LookAheadDepth="Look-ahead Depth (0 = preset)"
LookAheadDepth.ToolTip="Number of frames to look ahead (0-32) when Look-ahead is enabled.\nHigher values can improve quality at the cost of latency and GPU load."
LookAheadLevel="Look-ahead Level"
LookAheadLevel.0="Level 0"
LookAheadLevel.1="Level 1"
LookAheadLevel.2="Level 2"
LookAheadLevel.3="Level 3"
LookAheadLevel.ToolTip="Higher lookahead levels may improve quality at the expense of performance\n(HEVC only, SDK 12.2+, requires driver 570.20+)."
UniDirectB="Uni-directional B-frames"
UniDirectB.ToolTip="B-frames reference only past frames, improving compression efficiency in\nlow-latency scenarios (SDK 12.2+). Conflicts with weighted prediction."
TFLevel="Temporal Filter"
TFLevel.0="Off"
TFLevel.4="On"
TFLevel.ToolTip="Enables temporal filtering across frames for quality improvement (NVENC max strength, level 4).\nRequires at least 4 B-frames and SDK 13.0+."
DisableAdaptiveI="Disable Adaptive I-Frames"
DisableAdaptiveI.ToolTip="Disables adaptive I-frame insertion when Look-ahead is enabled."
DisableAdaptiveB="Disable Adaptive B-Frames"
DisableAdaptiveB.ToolTip="Disables adaptive B-frame insertion when Look-ahead is enabled."
NonRefP="Non-reference P-frames"
NonRefP.ToolTip="Allows the encoder to automatically insert non-reference P-frames: such frames are not used\nas a prediction reference by any later frame, so they can be dropped or degraded under load\nwithout corrupting subsequent frames.\nSlightly reduces compression efficiency. Requires PTD (always enabled in this plugin)."
WeightP="Weighted P-frames"
WeightP.ToolTip="Enables weighted prediction for P-frames, improving quality in fades and\nlow-motion scenes. Requires 0 B-frames and conflicts with forced split encoding."
MvPrecision="Motion Estimation Precision"
MvPrecision.Default="Auto"
MvPrecision.QuarterPel="Quarter-pel (high precision)"
MvPrecision.HalfPel="Half-pel"
MvPrecision.FullPel="Full-pel (fastest)"

